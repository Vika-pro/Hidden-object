<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hidden object</title>
	<style type="text/css">
		.bx1 {
			height: 55px; 
			width: 55px;
			left: 1050px; 
			top: 70px;
			position: absolute;
			background-image: url('3.png'); 
			background-size: 100% 100%; 
			cursor: pointer;

		}
		.bx2 {
			height: 60px; 
			width: 60px;
			left: 650px;
			top: 255px;
			position: absolute;
			background-image: url('4.png'); 
			background-size: 100% 100%;
			cursor: pointer;

		}
		.bx3 {
			height: 200px; 
			width: 200px;
			left: 250px; 
			top: 550px;
			position: absolute;
			background-image: url('5.png'); 
			background-size: 100% 100%; 
			cursor: pointer;

		}
		.bx4 {
			height: 90px; 
			width: 90px;
			left: 250px; 
			top: 700px;
			position: absolute;
			background-image: url('9.png'); 
			background-size: 100% 100%; 
			cursor: pointer;

		}
		.txt {
			color: white;
		}

		body{
			margin: 0;
			padding: 0;
		}

		.box {
			margin: 0;
			padding: 0;
		}
		.btn {
    padding: 0.5em 1.5em;
    font-size: 0.9em;
    color: #fff;
    background-color: #67ada9;
    border-width: 0;
    border-bottom: 4px solid #547b80;
    border-radius: 0.4em;
    position: absolute;
    top: 150px;
    display: none;
   }
	</style>
</head>
<body>
<div class="box" style="background-image: url('2.jpg'); background-size: 100% 100%; background-repeat: no-repeat; height: 950px;">
	
	<div style="height: 150px; width: 200px; background-color: gray; border-radius: 20px; position: absolute; top: 0px;">
		<h1 class="txt" style="text-align: center; margin-bottom: 0px;">Надо найти:</h1>
		<li class="txt1" style="">черный кот</li>
		<li class="txt2" style="">паук</li>
		<li class="txt3" style="">летучая мышь</li>
		<li class="txt4" style="">ключик</li>
	</div>
	<a href="index2.html" class="btn">Следующий уровень</a>
	<div class="bx1"></div>
	<div class="bx2"></div>
	<div class="bx3"></div>
	<div class="bx4"></div>
</div>
<script type="text/javascript">
	document.querySelector (".bx1").onclick = function(){
		document.querySelector (".bx1").style.display = "none"
		document.querySelector (".txt3").style.textDecoration = "line-through"
	}
	document.querySelector (".bx2").onclick = function(){
		document.querySelector (".bx2").style.display = "none"
		document.querySelector (".txt1").style.textDecoration = "line-through"
	}
	document.querySelector (".bx3").onclick = function(){
		document.querySelector (".bx3").style.display = "none"
		document.querySelector (".txt2").style.textDecoration = "line-through"
	}
	document.querySelector (".bx4").onclick = function(){
		document.querySelector (".btn").style.display = "block"
	}
</script>
</body>
</html>
